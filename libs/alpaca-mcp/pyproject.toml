[project]
name = "langalpha-alpaca-mcp"
version = "0.1.0"
description = "A paper-only Alpaca MCP server (streamable HTTP, stateless) for LangAlpha's order-approval stack"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # The backend pins the same SDK, so the sidecar and the relay that dials it
    # speak one protocol revision.
    "mcp==2.0.0",
    "httpx>=0.28.1",
    "uvicorn>=0.27.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpaca_mcp"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23"]

# A table of its own stops uv from walking up to the backend's [tool.uv] in the
# repository root, so the package resolves on its own.
[tool.uv]
required-version = ">=0.6.15"
cache-keys = [{ file = "pyproject.toml" }, { file = "alpaca_mcp/**/*" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
alpaca-mcp = "alpaca_mcp.server:main"
